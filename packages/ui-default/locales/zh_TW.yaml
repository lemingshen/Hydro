"The deadline has passed. This homework is evaluated by your teacher — your scores and the objective answers appear here once the evaluation has been published.": "截止時間已過。本次作業由教師評估——評估發布後，你的分數和客觀題答案會顯示在這裡。"
"Homework evaluated": "作業已評估"
"students see their results; released report grades count on the scoreboard.": "學生可以看到成績；已發布的報告分數計入成績表。"
"The deadline has passed but this homework is not evaluated yet — students see no results until you evaluate it.": "截止時間已過，但本次作業尚未評估——在你評估之前，學生看不到任何成績。"
"Evaluate the homework now": "立即評估作業"
"This homework contains a subjective task, so it is not evaluated when the deadline passes: press Evaluate here (or on the homework page) after the deadline to grade the objective answers, publish the results and start the report grading.": "本次作業包含主觀題，因此截止時不會自動評估：截止後請在此處（或作業頁面）點擊「評估」，以評判客觀題、發布成績並開始報告評分。"
