# --- 🧩 函式題：評測、標籤頁、AI 工作室、學習編輯 ---
"Function": "函式題"
"Function task": "函式題"
"Judge program": "裁判程式"
"Programming / Function": "程式設計題 / 函式題"
"You only write the function. It is inserted where the marker is, then the whole program below is compiled and run against the tests.": "你只需編寫函式。它會被插入到標記位置，然後下面的完整程式會被編譯並在測試資料上執行。"
"Reference solution (ONLY the function — it is inserted into the judge program)": "參考解答（僅函式——它會被插入裁判程式）"
"Stub the student starts from (the empty function)": "學生起始程式碼（空函式）"
"Students write ONE function; the AI writes the judge program around it. Verified like a programming task, plus a check that the judge program really depends on the student’s function.": "學生只編寫一個函式；AI 產生包裹它的裁判程式。驗證方式與程式設計題相同，並額外檢查裁判程式確實依賴學生的函式。"
"The complete program the student’s function is spliced into at the marker line \"/* Your function will be put here */\". It is shown to students on the problem page exactly as it runs here, and verification checks that it FAILS with the empty stub.": "學生函式將被插入到標記行 \"/* Your function will be put here */\" 處的完整程式。題目頁面展示給學生的正是這裡執行的程式，驗證時還會檢查它在空函式下必須不通過。"
"Self-learning sessions can only contain programming and function tasks. This session still lists the tasks below; remove them from the problem list before saving:": "自主學習只能包含程式設計題和函式題。本次學習仍列有以下題目，請在儲存前將它們從題目列表中移除："
"Search and pick programming or function problems from the problem set; entries are separated with \",\". Only code tasks can be added to a self-learning session — quiz and subjective tasks are not offered here. Students work through the tasks in this order, so put the simplest first; the AI advisor above can propose and apply a progression.": "從題庫中搜尋並選擇程式設計題或函式題，多個條目以 \",\" 分隔。自主學習只能新增程式碼類題目——客觀題和主觀題不會在此提供。學生依此順序完成題目，請把最簡單的放在最前；上方的 AI 顧問可以提出並套用一個遞進順序。"
"Once the session is created, every code task in it — the listed tasks and each student’s bonus task — can only be submitted in the selected languages. Leave it empty to allow every judge language. A task that already restricts its own languages (a function task, for instance, accepts only the languages its judge program is written for) accepts only those that are in both lists.": "建立後，其中的每道程式碼題——列出的題目以及每位學生的挑戰題——都只能用所選語言提交。留空則允許所有評測語言。已自行限制語言的題目（例如函式題只接受其裁判程式所用的語言）只接受同時在兩個列表中的語言。"
"Students will solve the selected programming and function problems inside this session. Every failed submission automatically opens an AI Socratic tutor that guides them at their code — without giving away the answer.": "學生將在本次學習中完成所選的程式設計題和函式題。每次提交失敗都會自動開啟 AI 蘇格拉底式導師，就他們的程式碼進行引導——但不會直接給出答案。"
"Students write only one function; it is spliced into your judge program and tested like a programming task.": "學生只編寫一個函式；它會被插入你的裁判程式，並像程式設計題一樣測試。"
"Language of the judge program": "裁判程式的語言"
"One judge program per language family; students may submit in any variant of that family.": "每個語言族一份裁判程式；學生可用該語言族的任意版本提交。"
"The complete program the student’s function is spliced into. Put the line": "學生函式將被插入的完整程式。請把這一行"
"where the function goes (without it, the function is appended at the end). Implement every helper fully — this is what actually runs.": "放在函式應插入的位置（沒有它則函式會被附加到末尾）。所有輔助函式都要完整實作——這就是實際執行的程式。"
"A function task needs its judge program — paste the complete program the student’s function is inserted into.": "函式題需要裁判程式——請貼上學生函式將被插入的完整程式。"
"Drafted together with the statement — appears once the statement exists.": "與題面一同產生——題面產生後即可檢視。"
"The complete program the student’s function is spliced into at the marker line \"/* Your function will be put here */\". Saving or regenerating it also refreshes the \"Sample program of judge\" section of the statement, so students read exactly what runs; verification checks that it FAILS with the empty stub.": "學生函式將被插入到標記行 \"/* Your function will be put here */\" 處的完整程式。儲存或重新產生時會同步更新題面中的「Sample program of judge」部分，學生看到的正是實際執行的程式；驗證時還會檢查它在空函式下必須不通過。"
