"Ownership = the mean LLM-graded level (0–4) of the student’s post-acceptance explanations of their own code, mapped onto 10 points. — means no explanations have been recorded yet (e.g. the acceptance predates this rubric): the student earns it by getting a task accepted again and answering the tutor’s walkthrough.": "講解分 = 學生在程式通過後向 AI 導師講解自己程式碼的回答品質（LLM 按 0–4 級評定後取平均），折算為 10 分。— 表示尚未記錄任何講解（例如通過發生在此評分項上線之前）：學生再次通過該題並回答導師的講解問題即可獲得。"
