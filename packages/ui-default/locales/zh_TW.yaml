"Students write only the function; your judge program does the rest. Judged and scored like programming tasks. Give each task the points it is worth.": "學生只需編寫函式，其餘由你的裁判程式完成。評測與計分方式與程式設計題相同。請為每道題填寫分值。"
"Search and pick programming problems from the problem set; entries are separated with \",\". Students work through the tasks in this order, so put the simplest first; the AI advisor above can propose and apply a progression.": "從題庫中搜尋並選擇程式設計題，多個條目以 \",\" 分隔。學生依此順序完成題目，請把最簡單的放在最前；上方的 AI 顧問可以提出並套用一個遞進順序。"
"Function tasks (pid F…): students write only the function and your judge program does the rest. They come after the programming tasks in the session order. Quiz and subjective tasks cannot be added to a self-learning session.": "函式題（題號 F…）：學生只需編寫函式，其餘由你的裁判程式完成。它們在學習順序中排在程式設計題之後。客觀題和主觀題不能加入自主學習。"
