"The session Total is the SUM of the per-task scores over all programming tasks. 🏁 finished · ⏭ skipped · 🎁 bonus task (✓ accepted).": "本環節總分為所有程式題目各題得分之和。🏁 已完成 · ⏭ 已跳過 · 🎁 獎勵題（✓ 已通過）。"
"Score per task = best judged submission, late tier applied (⏱ = reduced for lateness); the total is the sum of these scores.": "每題得分 = 最佳評測提交，並依遲交檔位折算（⏱ = 因遲交扣減）；總分為這些得分之和。"
"the total is the sum of these per-task scores": "總分 = 這些各題得分之和"
"n/t": "不可測"
"untestable for this student — no re-encounter with a learned concept was possible (disjoint knowledge points, the mistake came last, or nothing surfaced); the 🧠 slot is removed and these task scores renormalize onto 100 (×100/85).": "對該生無法測試——不存在可再遇的知識點（知識點互不重疊、錯誤發生在最後一題，或未暴露任何誤區）；🧠 該項從計分中移除，各題得分按 ×100/85 折算回 100 分。"
"renormalized — the transfer slot is untestable for this student": "已折算——概念遷移對該生不可測"
"mean explanation quality across your tasks, rounded to one decimal — the total uses each task’s exact value": "各題講解品質的平均值，顯示時四捨五入到一位小數——總分使用每題的精確值"
"the total is the average of these per-task scores": "總分 = 這些各題得分的平均值"
"n/a": "不適用"
"does not apply — every attempted task was passed on the very first attempt and is scored 🏆 40 + 🎓 60; this component only enters tasks that needed more than one attempt.": "不適用——所有做過的題目均首次提交即通過，按 🏆 40 + 🎓 60 計分；該項僅計入需要多次提交的題目。"
"tasks passed on the very first attempt are scored 🏆 40 + 🎓 60 each; the five mistake-handling components apply only to the remaining tasks.": "首次提交即通過的題目每題按 🏆 40 + 🎓 60 計分；五項與錯誤處理相關的指標僅計入其餘題目。"
"first-attempt tasks": "首次即過題目"
"The session Total is the AVERAGE of the per-task scores over all programming tasks: a task passed on the very first attempt is scored 🏆 40 + 🎓 60; any other task follows the seven components, with 📈 Trajectory and 🧠 Transfer entering at their session-level values; an unattempted task scores 0. 🏁 finished · ⏭ skipped · 🎁 bonus task (✓ accepted).": "本環節總分為所有程式題目各題得分的平均值：首次提交即通過的題目按 🏆 40 + 🎓 60 計分；其餘題目按七項細則計分（其中 📈 獨立軌跡與 🧠 概念遷移按環節級數值計入）；未作答的題目按 0 分。🏁 已完成 · ⏭ 已跳過 · 🎁 獎勵題（✓ 已通過）。"
"task score": "本題得分"
"not attempted — counts as 0 in the session mean": "未作答——按 0 分計入平均"
"… = part pending (not graded yet, counts 0 for now)": "… = 該部分待評定（暫按 0 分計）"
"Initiative": "主動分"
"Self-Diagnostic Initiative = does the student show up with a theory about their own bug, or wait to be led? One level per task, judged over the FIRST engagement only: a hypothesis volunteered before the tutor localizes the flaw (wrong is fine — volunteering is the point) combined with the quality of comprehension answers; LLM-graded 0–4, score = mean × 1.25, onto 5 points. — means no first-engagement failure dialogue judged yet.": "自診主動分 = 學生是帶著對自己 bug 的假設而來，還是等著被引導？每題僅評首次接觸階段一個等級：在導師定位缺陷之前是否主動提出假設（猜錯也算主動——主動本身才是關鍵），並結合理解性回答（複述題意、說明約束、解釋思路）的品質；由 LLM 按 0–4 級評定，得分 = 平均等級 × 1.25，折算為 5 分。— 表示尚無已評定的首次接觸失敗對話。"
"💡 Self-Diagnostic Initiative = showing up with a theory about the bug before the tutor localizes it, plus comprehension quality (one LLM-graded level 0–4 per task, first engagement only), mapped onto 5 points.": "💡 自診主動分 = 在導師定位缺陷之前主動提出對 bug 的假設，並結合理解性回答的品質（每題僅評首次接觸，由 LLM 按 0–4 級評定），折算為 5 分。"
"initiative": "主動"
"Reasoning": "推理分"
"Reasoning Quality = do the tutor’s questions get substantial answers during FAILED attempts — thinking, not guessing? Every failure-phase exchange is LLM-graded 0–4 (0 no substance … 1 bare guess … 3 correct specific reasoning … 4 plus predicting a consequence or generalizing); score = mean level × 6.25, onto 25 points. — means no failure-phase answers graded yet.": "推理質量分 = 程式未通過期間，學生對導師提問的回答是否有實質內容——是思考而非猜測？每次失敗階段的問答由 LLM 按 0–4 級評定（0 無實質回答 … 1 純猜測 … 3 對自己程式碼的正確且具體的推理 … 4 另能預測後果或加以概括）；得分 = 平均等級 × 6.25，折算為 25 分。— 表示尚無已評定的失敗階段回答。"
"🧩 Reasoning Quality = answers to the tutor during failed attempts are real reasoning, not guessing (each exchange LLM-graded 0–4), mapped onto 25 points.": "🧩 推理質量分 = 失敗提交期間對導師的回答是真實推理而非猜測（每次問答由 LLM 按 0–4 級評定），折算為 25 分。"
"reasoning": "推理"
"no substantive answer, off-topic, or restates the question": "無實質回答、跑題或複述問題"
"a guess with no reasoning": "無理由的猜測"
"relevant reasoning, but vague or partly wrong": "相關但含糊或部分錯誤的推理"
"correct, specific reasoning about their own code": "對自己程式碼的正確且具體的推理"
"correct reasoning plus predicts a consequence or generalizes": "推理正確並能預測後果或加以概括"
"grading pending — evaluate again": "待評定——請再次評估"
"learned on {0} — no later task shares this knowledge point": "在 {0} 學到——其後沒有共享該知識點的題目"
"no misconception surfaced in failure tutoring — nothing to transfer-test (a flawless run leaves no lesson to carry)": "失敗階段輔導中未暴露任何誤區——沒有可檢驗遷移的內容（零失誤的過程沒有可遷移的教訓）"
"Score per task = best judged submission, late tier applied (⏱ = reduced for lateness; hover for the raw score).": "每題得分 = 最佳評測提交，並依遲交檔位折算（⏱ = 因遲交扣減；懸停查看原始得分）。"
"🏆 Achievement = the programming tasks’ summed score mapped onto 20 points.": "🏆 成就分 = 程式題得分之和折算為 20 分。"
"🎓 Ownership = the mean quality of post-acceptance explanations to the AI tutor, mapped onto 10 points.": "🎓 講解分 = 通過後向 AI 導師講解自己程式碼的平均品質，折算為 10 分。"
"🔧 Fix Conversion = tutor guidance on failed attempts converting into correct, targeted changes (trial penalty 1 → 0.8 → 0.6 → 0.5; the counter restarts once a fix improves the verdict), mapped onto 15 points.": "🔧 改錯轉化分 = 失敗提交上導師引導轉化為正確、有針對性修改的程度（試錯懲罰 1 → 0.8 → 0.6 → 0.5；一旦修改使評測結果變好計數即重新開始），折算為 15 分。"
"📈 Independence Trajectory = needing less tutor help across the session (first-engagement exchanges, class percentiles — no help at all = 0th percentile, the better of level and improvement), mapped onto 10 points.": "📈 獨立軌跡分 = 在整個環節中逐漸減少對導師的依賴（首次接觸時的問答次數、全班百分位——完全無需幫助即按第 0 百分位、水平與進步取優），折算為 10 分。"
"🧠 Concept Transfer = a mistake resolved on one task must not recur on the next task with the same knowledge point (first re-encounter LLM-graded 0–4), mapped onto 15 points; when no re-encounter is possible for a student, this slot is removed and their task scores renormalize onto 100.": "🧠 概念遷移分 = 在一道題上解決過的錯誤，不應在下一道含相同知識點的題目上重犯（首次再遇由 LLM 按 0–4 級評定），折算為 15 分；若某位學生不存在可再遇的知識點，則該項從其計分中移除並按比例折算回 100 分。"
"Transfer": "遷移分"
"Concept Transfer = a mistake (missed knowledge point) made and resolved on one task — does it recur on the next task exercising the same concept? The FIRST re-encounter is LLM-graded 0–4 (0 relapse-unrecognized … 3 correct unprompted … 4 plus awareness); a parked task where the concept was raised but never resolved sets no baseline. Score = mean level × 3.75, onto 15 points. — means nothing testable yet (needs knowledge-point tags and a re-encounter).": "概念遷移分 = 學生在一道題上犯過並已解決的錯誤（缺失的知識點），是否會在下一道包含相同知識點的題目上重犯？僅評定首次再遇，由 LLM 按 0–4 級評定（0 = 重犯且未意識 … 3 = 首次提交即正確、無需提示 … 4 = 另有掌握的明證）；若該知識點在某題被提出但擱置未解決，則不設基線。得分 = 平均等級 × 3.75，折算為 15 分。— 表示暫無可測內容（需要知識點標籤及再次遇到）。"
"concept transfer": "概念遷移"
"Trajectory": "軌跡分"
"Independence Trajectory = does the student gradually need less tutor help? Per task, the exchanges answered at FIRST engagement (before the correct fix or before parking) become a class percentile (needing NO help at all always counts as the 0th percentile); the score is the better of overall independence (100 − mean percentile) and improvement (a fitted downward trend), mapped onto 10 points. A student accepted on every task at the first attempt therefore scores the full 10. — means not engaged or not evaluated yet.": "獨立軌跡分 = 學生是否逐漸減少對導師的依賴？每題以首次接觸期間（在改對或擱置之前）回答導師問題的次數換算為全班百分位（完全無需幫助始終按第 0 百分位計）；得分取整體獨立性（100 − 平均百分位）與進步趨勢（擬合下降斜率）二者較高者，折算為 10 分。因此全部題目首次提交即通過的學生可得滿分 10 分。— 表示未參與或尚未評估。"
"independence trajectory": "獨立軌跡"
"level {0} · improvement {1}": "水平 {0} · 進步 {1}"
"class percentile of tutor help at first engagement, in the order tasks were started (low = little help)": "按開始做題的順序列出首次接觸時求助量的全班百分位（越低表示求助越少）"
"Fix Conversion = do tutor-guided fixes on failed attempts land as correct, targeted changes? Each guided resubmission is LLM-graded 0–4 with a trial penalty (1 → 0.8 → 0.6 → 0.5; the counter restarts once a fix improves the verdict, so different errors each start at trial 1), mapped onto 15 points. — means nothing to judge yet. A task accepted on the very first attempt counts as level 4.": "改錯轉化分 = 導師在失敗提交上的引導是否轉化為正確且有針對性的程式碼修改？每次引導後的重新提交由 LLM 按 0–4 級評定，並依試錯次數乘以懲罰係數（1 → 0.8 → 0.6 → 0.5；一旦修改使評測結果變好，計數即重新開始——不同錯誤各自從第 1 次算起），折算為 15 分。— 表示暫無可評定的記錄。首次提交即通過的題目按 4 級計。"
"accepted on the first attempt → counts as level 4": "首次提交即通過——按 4 級計"
"Fix Conversion": "改錯轉化分"
"Fix Conversion = do tutor-guided fixes on failed attempts land as correct, targeted changes? Each guided resubmission is LLM-graded 0–4 with a trial penalty (1 → 0.8 → 0.6 → 0.5; the counter restarts once a fix improves the verdict, so different errors each start at trial 1), mapped onto 15 points. — means nothing to judge yet.": "改錯轉化分 = 導師在失敗提交上的引導是否轉化為正確且有針對性的程式碼修改？每次引導後的重新提交由 LLM 按 0–4 級評定，並依試錯次數乘以懲罰係數（1 → 0.8 → 0.6 → 0.5；一旦修改使評測結果變好，計數即重新開始——不同錯誤各自從第 1 次算起），折算為 15 分。— 表示暫無可評定的記錄。"
"Achievement = programming score mapped onto 20; Ownership = explaining your accepted code, mapped onto 10; Fix Conversion = turning tutor guidance on failed attempts into correct fixes, mapped onto 15; Transfer = lessons learned on one task carrying to the next task with the same concept, mapped onto 15; Reasoning = thinking-not-guessing in failure answers, mapped onto 25; Initiative = showing up with a theory, mapped onto 5; the total is the AVERAGE of the per-task scores — a task passed on the first attempt counts 🏆 40 + 🎓 60; other tasks follow the seven components.": "成就分 = 程式題得分折算為 20 分；講解分 = 講解已通過的程式碼，折算為 10 分；改錯轉化分 = 將導師對失敗提交的引導轉化為正確修改，折算為 15 分；獨立軌跡分 = 逐漸減少對導師的依賴，折算為 10 分；概念遷移分 = 在一道題學到的教訓能否用於下一道含相同知識點的題目，折算為 15 分；推理分 = 失敗階段回答是思考而非猜測，折算為 25 分；主動分 = 帶著假設而來，折算為 5 分；總分為各題得分的平均值——首次提交即通過的題目按 🏆 40 + 🎓 60 計；其餘題目按七項細則計。"
