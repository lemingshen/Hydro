"= mean walkthrough level × {0} — the tutor asks 5–6 questions after a first-attempt acceptance, 2–3 otherwise; answers are LLM-graded L0–L4 (0 evasion · 1 restates · 2 mechanical · 3 why necessary · 4 generalization), an unanswered question counting L0.": "= 讲解问答平均等级 × {0}——一次提交即通过时导师提出 5–6 个问题，否则 2–3 个；回答由 LLM 按 L0–L4 评级（0 回避 · 1 复述 · 2 机制正确 · 3 说明必要性 · 4 给出推广），未回答的问题按 L0 计。"
"Guidance-to-Fix Conversion — penalty-weighted mean level × {0} on failed-attempt → guided → resubmission transitions": "指导修复转化——在「失败提交 → 回答指导 → 重新提交」的转化上按试次惩罚加权的平均等级 × {0}"
