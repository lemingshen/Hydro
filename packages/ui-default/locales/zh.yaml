"Independence Trajectory ({0}) = one LLM level × {1} over every submission chain and tutor exchange, chronologically — L0 dependent throughout · L1 marginal movement · L2 uneven or middling · L3 solid independence · L4 strong independence (tutorless solves count as fully independent); — = not judged yet (counts 0).": "独立性轨迹（{0} 分）= 基于按时间排列的全部提交链与师生交流，一次性 LLM 评级 × {1}——L0 全程依赖 · L1 略有起色 · L2 起伏不定或中等水平 · L3 稳固的独立性 · L4 很强的独立性（未借助导师即通过的题目视为完全独立完成）；— 表示尚未评定（计 0 分）。"
