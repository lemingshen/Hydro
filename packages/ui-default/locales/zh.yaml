# --- 🧩 函数题：评测、标签页、AI 工作室、学习编辑 ---
"Function": "函数题"
"Function task": "函数题"
"Judge program": "裁判程序"
"Programming / Function": "编程题 / 函数题"
"You only write the function. It is inserted where the marker is, then the whole program below is compiled and run against the tests.": "你只需编写函数。它会被插入到标记位置，然后下面的完整程序会被编译并在测试用例上运行。"
"Reference solution (ONLY the function — it is inserted into the judge program)": "参考解答（仅函数——它会被插入裁判程序）"
"Stub the student starts from (the empty function)": "学生起始代码（空函数）"
"Students write ONE function; the AI writes the judge program around it. Verified like a programming task, plus a check that the judge program really depends on the student’s function.": "学生只编写一个函数；AI 生成包裹它的裁判程序。验证方式与编程题相同，并额外检查裁判程序确实依赖学生的函数。"
"The complete program the student’s function is spliced into at the marker line \"/* Your function will be put here */\". It is shown to students on the problem page exactly as it runs here, and verification checks that it FAILS with the empty stub.": "学生函数将被插入到标记行 \"/* Your function will be put here */\" 处的完整程序。题目页面展示给学生的正是这里运行的程序，验证时还会检查它在空函数下必须不通过。"
"Self-learning sessions can only contain programming and function tasks. This session still lists the tasks below; remove them from the problem list before saving:": "自主学习只能包含编程题和函数题。本次学习仍列有以下题目，请在保存前将它们从题目列表中移除："
"Search and pick programming or function problems from the problem set; entries are separated with \",\". Only code tasks can be added to a self-learning session — quiz and subjective tasks are not offered here. Students work through the tasks in this order, so put the simplest first; the AI advisor above can propose and apply a progression.": "从题库中搜索并选择编程题或函数题，多个条目以 \",\" 分隔。自主学习只能添加代码类题目——客观题和主观题不会在此提供。学生按此顺序完成题目，请把最简单的放在最前；上方的 AI 顾问可以提出并应用一个递进顺序。"
"Once the session is created, every code task in it — the listed tasks and each student’s bonus task — can only be submitted in the selected languages. Leave it empty to allow every judge language. A task that already restricts its own languages (a function task, for instance, accepts only the languages its judge program is written for) accepts only those that are in both lists.": "创建后，其中的每道代码题——列出的题目以及每位学生的挑战题——都只能用所选语言提交。留空则允许所有评测语言。已自行限制语言的题目（例如函数题只接受其裁判程序所用的语言）只接受同时在两个列表中的语言。"
"Students will solve the selected programming and function problems inside this session. Every failed submission automatically opens an AI Socratic tutor that guides them at their code — without giving away the answer.": "学生将在本次学习中完成所选的编程题和函数题。每次提交失败都会自动打开 AI 苏格拉底式导师，就他们的代码进行引导——但不会直接给出答案。"
"Students write only one function; it is spliced into your judge program and tested like a programming task.": "学生只编写一个函数；它会被插入你的裁判程序，并像编程题一样测试。"
"Language of the judge program": "裁判程序的语言"
"One judge program per language family; students may submit in any variant of that family.": "每个语言族一份裁判程序；学生可用该语言族的任意版本提交。"
"The complete program the student’s function is spliced into. Put the line": "学生函数将被插入的完整程序。请把这一行"
"where the function goes (without it, the function is appended at the end). Implement every helper fully — this is what actually runs.": "放在函数应插入的位置（没有它则函数会被追加到末尾）。所有辅助函数都要完整实现——这就是实际运行的程序。"
"A function task needs its judge program — paste the complete program the student’s function is inserted into.": "函数题需要裁判程序——请粘贴学生函数将被插入的完整程序。"
"Drafted together with the statement — appears once the statement exists.": "与题面一同生成——题面生成后即可查看。"
"The complete program the student’s function is spliced into at the marker line \"/* Your function will be put here */\". Saving or regenerating it also refreshes the \"Sample program of judge\" section of the statement, so students read exactly what runs; verification checks that it FAILS with the empty stub.": "学生函数将被插入到标记行 \"/* Your function will be put here */\" 处的完整程序。保存或重新生成时会同步更新题面中的\"Sample program of judge\"部分，学生看到的正是实际运行的程序；验证时还会检查它在空函数下必须不通过。"
