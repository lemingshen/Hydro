"⏱ Late penalty: your last counted submission was {0}h past the deadline — total × {1}.": "⏱ 迟交惩罚：你最后一次计分提交晚于截止 {0} 小时——总分 × {1}。"
"Students can enter from the begin time. Late work inside the extension is penalized by the tiered rules above: each line is \"hours: coefficient\", and the STUDENT’S TOTAL is multiplied by the tier of their last counted submission — once it is more than N hours late, that tier’s coefficient applies (lateness before the first tier rides free). After the extension, submissions close while review and the AI tutor stay open.": "学生自开始时间起即可进入。延长期内的迟交按上方分档规则惩罚：每行形如「小时: 系数」，学生的总分将乘以其最后一次计分提交所落档位的系数——一旦晚于 N 小时，即适用该档系数（未超过第一档的迟交不扣分）。延长期结束后停止提交，但查看与 AI 导师仍然开放。"
