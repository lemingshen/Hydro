"Concept Transfer ({0}) = mean re-encounter level × {1}: per knowledge point, the baseline is the first task where it surfaced as the student’s own misconception AND was resolved (a parked raise sets no baseline); the first later task exercising it is judged — L0 relapse, unrecognized · L1 relapse, recognized on prompt · L2 handled, but fragile · L3 applied correctly, unprompted · L4 plus positive evidence of command; no relevant knowledge points among the tasks → the full {2} directly; — = judging pending (counts 0).": "概念迁移（{0} 分）= 再次遇到时的平均等级 × {1}：对每个知识点，以其首次作为学生自身误解被揭示且该题得到解决的题目为基线（提出后即搁置的题目不设基线）；随后第一道涉及该知识点的题目接受评级——L0 重犯且未察觉 · L1 重犯但经提示即认出 · L2 已处理但不稳固 · L3 无提示下正确运用 · L4 更有掌握的明确迹象；若各题之间没有相关知识点 → 直接给满分 {2}；— 表示评级待定（计 0 分）。"
"🅱 = 📈 + 🧠; Total = 🅰 + 🅱.": "🅱 = 📈 + 🧠；总分 = 🅰 + 🅱。"
