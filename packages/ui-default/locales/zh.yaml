"t": "次"
"no guided fixes judged yet": "尚无已评定的指导修复"
"= penalty-weighted mean level × {0} — judged on every failed-attempt → answered-guidance → resubmission transition; trials decay 1 → 0.8 → 0.6 → 0.5; L0 domain unchanged · L1 thrashing · L2 incomplete · L3 flaw addressed · L4 minimal targeted fix; engaging and then never resubmitting is not counted; — = nothing judged yet (counts 0).": "= 按试次惩罚加权的平均等级 × {0}——在每次「失败提交 → 回答指导 → 重新提交」的转化上评定；试次惩罚依次为 1 → 0.8 → 0.6 → 0.5；L0 目标区域未改动 · L1 乱改（无关或错误）· L2 区域正确但修复不完整 · L3 正确解决该缺陷 · L4 以最小且有针对性的改动解决；参与指导后未再提交的不计入；— 表示尚无评定（计 0 分）。"
