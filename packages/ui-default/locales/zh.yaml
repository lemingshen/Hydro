"tasks passed on the very first attempt are scored 🏆 40 + 🎓 60 each; the five mistake-handling components apply only to the remaining tasks.": "首次提交即通过的题目每题按 🏆 40 + 🎓 60 计分；五项与错误处理相关的指标仅计入其余题目。"
"first-attempt tasks": "首次即过题目"
"The session Total is the AVERAGE of the per-task scores over all programming tasks: a task passed on the very first attempt is scored 🏆 40 + 🎓 60; any other task follows the seven components, with 📈 Trajectory and 🧠 Transfer entering at their session-level values; an unattempted task scores 0. 🏁 finished · ⏭ skipped · 🎁 bonus task (✓ accepted).": "本环节总分为所有编程题目各题得分的平均值：首次提交即通过的题目按 🏆 40 + 🎓 60 计分；其余题目按七项细则计分（其中 📈 独立轨迹与 🧠 概念迁移按环节级数值计入）；未作答的题目按 0 分。🏁 已完成 · ⏭ 已跳过 · 🎁 奖励题（✓ 已通过）。"
"not attempted — counts as 0 in the session mean": "未作答——按 0 分计入平均"
"… = part pending (not graded yet, counts 0 for now)": "… = 该部分待评定（暂按 0 分计）"
"Initiative": "主动分"
"Self-Diagnostic Initiative = does the student show up with a theory about their own bug, or wait to be led? One level per task, judged over the FIRST engagement only: a hypothesis volunteered before the tutor localizes the flaw (wrong is fine — volunteering is the point) combined with the quality of comprehension answers; LLM-graded 0–4, score = mean × 1.25, onto 5 points. — means no first-engagement failure dialogue judged yet.": "自诊主动分 = 学生是带着对自己 bug 的假设而来，还是等着被引导？每题仅评首次接触阶段一个等级：在导师定位缺陷之前是否主动提出假设（猜错也算主动——主动本身才是关键），并结合理解性回答（复述题意、说明约束、解释思路）的质量；由 LLM 按 0–4 级评定，得分 = 平均等级 × 1.25，折算为 5 分。— 表示尚无已评定的首次接触失败对话。"
"💡 Self-Diagnostic Initiative = showing up with a theory about the bug before the tutor localizes it, plus comprehension quality (one LLM-graded level 0–4 per task, first engagement only), mapped onto 5 points.": "💡 自诊主动分 = 在导师定位缺陷之前主动提出对 bug 的假设，并结合理解性回答的质量（每题仅评首次接触，由 LLM 按 0–4 级评定），折算为 5 分。"
"initiative": "主动"
"Reasoning": "推理分"
"Reasoning Quality = do the tutor’s questions get substantial answers during FAILED attempts — thinking, not guessing? Every failure-phase exchange is LLM-graded 0–4 (0 no substance … 1 bare guess … 3 correct specific reasoning … 4 plus predicting a consequence or generalizing); score = mean level × 6.25, onto 25 points. — means no failure-phase answers graded yet.": "推理质量分 = 程序未通过期间，学生对导师提问的回答是否有实质内容——是思考而非猜测？每次失败阶段的问答由 LLM 按 0–4 级评定（0 无实质回答 … 1 纯猜测 … 3 对自己代码的正确且具体的推理 … 4 另能预测后果或加以概括）；得分 = 平均等级 × 6.25，折算为 25 分。— 表示尚无已评定的失败阶段回答。"
"🧩 Reasoning Quality = answers to the tutor during failed attempts are real reasoning, not guessing (each exchange LLM-graded 0–4), mapped onto 25 points.": "🧩 推理质量分 = 失败提交期间对导师的回答是真实推理而非猜测（每次问答由 LLM 按 0–4 级评定），折算为 25 分。"
"reasoning": "推理"
"no substantive answer, off-topic, or restates the question": "无实质回答、跑题或复述问题"
"a guess with no reasoning": "无理由的猜测"
"relevant reasoning, but vague or partly wrong": "相关但含糊或部分错误的推理"
"correct, specific reasoning about their own code": "对自己代码的正确且具体的推理"
"correct reasoning plus predicts a consequence or generalizes": "推理正确并能预测后果或加以概括"
"grading pending — evaluate again": "待评定——请再次评估"
"learned on {0} — no later task shares this knowledge point": "在 {0} 学到——其后没有共享该知识点的题目"
"no misconception surfaced in failure tutoring — nothing to transfer-test (a flawless run leaves no lesson to carry)": "失败阶段辅导中未暴露任何误区——没有可检验迁移的内容（零失误的过程没有可迁移的教训）"
"Score per task = best judged submission, late tier applied (⏱ = reduced for lateness; hover for the raw score).": "每题得分 = 最佳评测提交，并按迟交档位折算（⏱ = 因迟交扣减；悬停查看原始得分）。"
"🏆 Achievement = the programming tasks’ summed score mapped onto 20 points.": "🏆 成就分 = 编程题得分之和折算为 20 分。"
"🎓 Ownership = the mean quality of post-acceptance explanations to the AI tutor, mapped onto 10 points.": "🎓 讲解分 = 通过后向 AI 导师讲解自己代码的平均质量，折算为 10 分。"
"🔧 Fix Conversion = tutor guidance on failed attempts converting into correct, targeted changes (trial penalty 1 → 0.8 → 0.6 → 0.5; the counter restarts once a fix improves the verdict), mapped onto 15 points.": "🔧 改错转化分 = 失败提交上导师引导转化为正确、有针对性修改的程度（试错惩罚 1 → 0.8 → 0.6 → 0.5；一旦修改使评测结果变好计数即重新开始），折算为 15 分。"
"📈 Independence Trajectory = needing less tutor help across the session (first-engagement exchanges, class percentiles — no help at all = 0th percentile, the better of level and improvement), mapped onto 10 points.": "📈 独立轨迹分 = 在整个环节中逐渐减少对导师的依赖（首次接触时的问答次数、全班百分位——完全无需帮助即按第 0 百分位、水平与进步取优），折算为 10 分。"
"🧠 Concept Transfer = a mistake resolved on one task must not recur on the next task with the same knowledge point (first re-encounter LLM-graded 0–4), mapped onto 15 points; when no re-encounter is possible for a student, this slot is removed and their task scores renormalize onto 100.": "🧠 概念迁移分 = 在一道题上解决过的错误，不应在下一道含相同知识点的题目上重犯（首次再遇由 LLM 按 0–4 级评定），折算为 15 分；若某位学生不存在可再遇的知识点，则该项从其计分中移除并按比例折算回 100 分。"
"Transfer": "迁移分"
"Concept Transfer = a mistake (missed knowledge point) made and resolved on one task — does it recur on the next task exercising the same concept? The FIRST re-encounter is LLM-graded 0–4 (0 relapse-unrecognized … 3 correct unprompted … 4 plus awareness); a parked task where the concept was raised but never resolved sets no baseline. Score = mean level × 3.75, onto 15 points. — means nothing testable yet (needs knowledge-point tags and a re-encounter).": "概念迁移分 = 学生在一道题上犯过并已解决的错误（缺失的知识点），是否会在下一道包含相同知识点的题目上重犯？仅评定首次再遇，由 LLM 按 0–4 级评定（0 = 重犯且未意识 … 3 = 首次提交即正确、无需提示 … 4 = 另有掌握的明证）；若该知识点在某题被提出但搁置未解决，则不设基线。得分 = 平均等级 × 3.75，折算为 15 分。— 表示暂无可测内容（需要知识点标签及再次遇到）。"
"concept transfer": "概念迁移"
"Trajectory": "轨迹分"
"Independence Trajectory = does the student gradually need less tutor help? Per task, the exchanges answered at FIRST engagement (before the correct fix or before parking) become a class percentile (needing NO help at all always counts as the 0th percentile); the score is the better of overall independence (100 − mean percentile) and improvement (a fitted downward trend), mapped onto 10 points. A student accepted on every task at the first attempt therefore scores the full 10. — means not engaged or not evaluated yet.": "独立轨迹分 = 学生是否逐渐减少对导师的依赖？每题以首次接触期间（在改对或搁置之前）回答导师问题的次数换算为全班百分位（完全无需帮助始终按第 0 百分位计）；得分取整体独立性（100 − 平均百分位）与进步趋势（拟合下降斜率）二者较高者，折算为 10 分。因此全部题目首次提交即通过的学生可得满分 10 分。— 表示未参与或尚未评估。"
"independence trajectory": "独立轨迹"
"level {0} · improvement {1}": "水平 {0} · 进步 {1}"
"class percentile of tutor help at first engagement, in the order tasks were started (low = little help)": "按开始做题的顺序列出首次接触时求助量的全班百分位（越低表示求助越少）"
"Fix Conversion = do tutor-guided fixes on failed attempts land as correct, targeted changes? Each guided resubmission is LLM-graded 0–4 with a trial penalty (1 → 0.8 → 0.6 → 0.5; the counter restarts once a fix improves the verdict, so different errors each start at trial 1), mapped onto 15 points. — means nothing to judge yet. A task accepted on the very first attempt counts as level 4.": "改错转化分 = 导师在失败提交上的引导是否转化为正确且有针对性的代码修改？每次引导后的重新提交由 LLM 按 0–4 级评定，并按试错次数乘以惩罚系数（1 → 0.8 → 0.6 → 0.5；一旦修改使评测结果变好，计数即重新开始——不同错误各自从第 1 次算起），折算为 15 分。— 表示暂无可评定的记录。首次提交即通过的题目按 4 级计。"
"accepted on the first attempt → counts as level 4": "首次提交即通过——按 4 级计"
"Fix Conversion": "改错转化分"
"Fix Conversion = do tutor-guided fixes on failed attempts land as correct, targeted changes? Each guided resubmission is LLM-graded 0–4 with a trial penalty (1 → 0.8 → 0.6 → 0.5; the counter restarts once a fix improves the verdict, so different errors each start at trial 1), mapped onto 15 points. — means nothing to judge yet.": "改错转化分 = 导师在失败提交上的引导是否转化为正确且有针对性的代码修改？每次引导后的重新提交由 LLM 按 0–4 级评定，并按试错次数乘以惩罚系数（1 → 0.8 → 0.6 → 0.5；一旦修改使评测结果变好，计数即重新开始——不同错误各自从第 1 次算起），折算为 15 分。— 表示暂无可评定的记录。"
"Achievement = programming score mapped onto 20; Ownership = explaining your accepted code, mapped onto 10; Fix Conversion = turning tutor guidance on failed attempts into correct fixes, mapped onto 15; Transfer = lessons learned on one task carrying to the next task with the same concept, mapped onto 15; Reasoning = thinking-not-guessing in failure answers, mapped onto 25; Initiative = showing up with a theory, mapped onto 5; the total is the AVERAGE of the per-task scores — a task passed on the first attempt counts 🏆 40 + 🎓 60; other tasks follow the seven components.": "成就分 = 编程题得分折算为 20 分；讲解分 = 讲解已通过的代码，折算为 10 分；改错转化分 = 将导师对失败提交的引导转化为正确修改，折算为 15 分；独立轨迹分 = 逐渐减少对导师的依赖，折算为 10 分；概念迁移分 = 在一道题学到的教训能否用于下一道含相同知识点的题目，折算为 15 分；推理分 = 失败阶段回答是思考而非猜测，折算为 25 分；主动分 = 带着假设而来，折算为 5 分；总分为各题得分的平均值——首次提交即通过的题目按 🏆 40 + 🎓 60 计；其余题目按七项细则计。"
