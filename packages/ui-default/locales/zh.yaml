"Reasoning Quality — mean level × {0} on failure-phase answers, judged per exchange": "推理质量——在失败阶段的回答上按每次交流评定的平均等级 × {0}"
"mean level": "平均等级"
"a": "答"
"no failure-phase answers graded yet": "尚无已评定的失败阶段回答"
"= mean level × {0} — every failure-phase answer (while the program is not accepted) is judged per exchange, across all cycles: L0 no substantive answer, off-topic, or restates the question · L1 a guess with no reasoning (“maybe the loop?”) · L2 relevant reasoning but vague or partly wrong · L3 correct, specific reasoning about their own code · L4 correct reasoning plus predicts a consequence or generalizes; — = nothing graded yet (counts 0).": "= 平均等级 × {0}——程序尚未通过期间的每一次回答均按交流逐次评定、贯穿所有循环：L0 无实质回答、跑题或复述问题 · L1 无推理的猜测（「可能是循环？」）· L2 相关推理但含糊或部分错误 · L3 对自己代码的正确、具体的推理 · L4 正确推理并预测后果或加以推广；— 表示尚无评定（计 0 分）。"
"Now grading reasoning": "正在评定推理"
"Grading reasoning answers": "评定推理回答"
"Self-Diagnostic Initiative — first-engagement level × {0}: did they show up with a theory?": "自我诊断主动性——首次交互等级 × {0}：学生是否带着自己的猜想而来？"
"first engagement": "首次交互"
"not judged yet — needs a closed first engagement with answers": "尚未评定——需有已结束且有回答的首次交互"
"= first-engagement level × {0} — one grade per task: did the student volunteer a hypothesis before the tutor localized the flaw (a wrong one still counts), and how well did they answer the comprehension stages (restate the task, state the constraints, explain the approach)? L0 no hypothesis, weak comprehension · L1 no hypothesis, adequate comprehension · L2 vague hypothesis (“something with the loop”) or strong comprehension alone · L3 specific, plausible hypothesis pointing at the right area · L4 specific hypothesis identifying the actual flaw; judged once the first engagement closes; — = not judged yet (counts 0).": "= 首次交互等级 × {0}——每题只评一次：在导师定位缺陷之前，学生是否主动提出了假设（哪怕是错的也算），以及理解阶段问题（复述题意、说明约束、解释思路）回答得如何？L0 无假设且理解薄弱 · L1 无假设但理解尚可 · L2 模糊的假设（「大概是循环的问题」）或仅有扎实的理解 · L3 指向正确区域的具体、合理的假设 · L4 直接指出真正缺陷的具体假设；首次交互结束后评定；— 表示尚未评定（计 0 分）。"
"🅰 Block A = task sum ÷ (tasks × {0}) × {1} — e.g. 500/500 → 75, 250/500 → 37.5.": "🅰 板块 A = 各题得分之和 ÷（题数 × {0}）× {1}——例如 500/500 → 75，250/500 → 37.5。"
"Block A · per-task rubrics: task sum ÷ (tasks × 100) × {0}, all five sub-rubrics live": "板块 A · 单题评分细则：各题得分之和 ÷（题数 × 100）× {0}，五个子细则均已启用"
"Block A · per-task rubrics: task sum ÷ (tasks × {0}) × {1}, all five sub-rubrics live": "板块 A · 单题评分细则：各题得分之和 ÷（题数 × {0}）× {1}，五个子细则均已启用"
